<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NontonAnime - Streaming Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; }
        .anime-card { transition: all 0.3s ease; }
        .anime-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body>

    <nav class="p-5 bg-slate-900 shadow-xl sticky top-0 z-50">
        <div class="container mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-bold text-blue-500 cursor-pointer" onclick="location.reload()">
                Nonton<span class="text-white">Anime</span>
            </h1>
            
            <div class="flex w-full md:w-auto gap-2">
                <input type="text" id="search-input" placeholder="Cari anime..." 
                    class="w-full md:w-64 px-4 py-2 rounded bg-slate-800 border border-slate-700 focus:outline-none focus:border-blue-500 text-sm">
                <button onclick="handleSearch()" class="bg-blue-600 px-6 py-2 rounded text-sm font-bold hover:bg-blue-700">
                    Cari
                </button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto mt-10 p-5">
        <h2 id="section-title" class="text-3xl font-bold mb-8 border-l-4 border-blue-500 pl-4">
            Ongoing Anime
        </h2>
        
        <div id="anime-list" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6">
            <div class="col-span-full text-center py-20">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mx-auto"></div>
                <p class="mt-4 text-slate-400">Menghubungkan ke server...</p>
            </div>
        </div>
    </main>

    <script>
        const BASE_URL = 'https://anime.anibiplay.my.id/api';

        // 1. Fungsi Ambil Data
        async function fetchAPI(path) {
            try {
                const response = await fetch(`${BASE_URL}${path}`);
                const result = await response.json();
                return result.data || result;
            } catch (err) {
                console.error("Gagal mengambil data:", err);
                return null;
            }
        }

        // 2. Fungsi Render Kartu Anime
        function renderCards(list) {
            const container = document.getElementById('anime-list');
            container.innerHTML = '';

            if (!list || list.length === 0) {
                container.innerHTML = '<p class="col-span-full text-center text-slate-500 text-xl">Anime tidak ditemukan.</p>';
                return;
            }

            list.forEach(item => {
                const card = document.createElement('div');
                card.className = "anime-card bg-slate-800 rounded-xl overflow-hidden shadow-lg cursor-pointer group relative";
                
                // Note: Kita menggunakan item.endpoint sebagai ID untuk pindah halaman
                card.innerHTML = `
                    <div class="relative overflow-hidden">
                        <img src="${item.thumb}" alt="${item.title}" class="w-full h-72 object-cover group-hover:scale-110 transition duration-500">
                        <div class="absolute top-2 right-2 bg-blue-600 text-[10px] font-bold px-2 py-1 rounded shadow-lg">
                            ${item.episode || 'HOT'}
                        </div>
                    </div>
                    <div class="p-4">
                        <h3 class="text-sm font-bold line-clamp-2 mb-1 group-hover:text-blue-400" title="${item.title}">
                            ${item.title}
                        </h3>
                        <p class="text-[11px] text-slate-500">${item.uploaded_on || ''}</p>
                    </div>
                `;

                // Logic Klik: Pindah ke watch.html dengan parameter endpoint
                card.onclick = () => {
                    window.location.href = `watch.html?id=${item.endpoint}`;
                };

                container.appendChild(card);
            });
        }

        // 3. Logic Pencarian
        async function handleSearch() {
    const query = document.getElementById('search-input').value.trim();
    
    // Jangan kirim jika input kosong
    if (!query) {
        alert("Masukkan judul anime yang ingin dicari!");
        return;
    }

    const container = document.getElementById('anime-list');
    const titleHeader = document.getElementById('section-title');
    
    container.innerHTML = '<div class="col-span-full text-center">Mencari "' + query + '"...</div>';
    titleHeader.innerText = `Hasil Pencarian: ${query}`;

    try {
        // Gunakan encodeURIComponent agar spasi/karakter unik tidak error di URL
        const response = await fetch(`${BASE_URL}/search/${encodeURIComponent(query)}`);
        
        if (!response.ok) throw new Error('Server API bermasalah');
        
        const result = await response.json();
        
        // Cek apakah data ada di result.data atau langsung di result
        const finalData = result.data || result;
        
        renderCards(finalData);
        
    } catch (err) {
        console.error("Detail Error:", err);
        container.innerHTML = `<p class="col-span-full text-center text-red-500">Gagal mencari: ${err.message}</p>`;
    }
}

        // 4. Inisialisasi (Tampilkan Ongoing saat pertama buka)
        async function init() {
            const data = await fetchAPI('/ongoing');
            renderCards(data);
        }

        // Jalankan pas mulai
        init();

        // Support tekan Enter di kolom cari
        document.getElementById('search-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSearch();
        });
    </script>
</body>
</html>
