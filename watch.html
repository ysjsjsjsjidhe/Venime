<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nonton Video - AnimeStream</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
    <style>
        body { background-color: #0f172a; color: white; }
        .video-container { aspect-ratio: 16 / 9; width: 100%; background: #000; }
    </style>
</head>
<body>

    <nav class="p-4 bg-slate-900 shadow-md">
        <a href="index.html" class="text-blue-500 font-bold">← Kembali ke Home</a>
    </nav>

    <div class="container mx-auto p-4 lg:p-10">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-2">
                <div id="player" class="video-container rounded-lg shadow-2xl"></div>
                <h1 id="video-title" class="text-2xl font-bold mt-6 text-slate-100 italic">Memuat judul...</h1>
                <div class="mt-4 p-4 bg-slate-800 rounded-lg">
                    <p id="video-info" class="text-slate-400">Silakan pilih resolusi jika tersedia.</p>
                </div>
            </div>

            <div class="bg-slate-800 p-4 rounded-lg h-fit">
                <h2 class="text-xl font-semibold mb-4 border-b border-slate-700 pb-2">Informasi</h2>
                <div id="episode-list" class="space-y-2">
                    <p class="text-sm text-slate-400">Detail streaming sedang dimuat...</p>
                </div>
            </div>

        </div>
    </div>

    <script src="watch.js"></script>
</body>
</html>
